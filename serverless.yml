org: jonvibes
service: document-analyzer-api

provider:
  name: aws
  region: us-east-1
  runtime: python3.11
  architecture: arm64
  enviroment:
    BUCKET_NAME: !Ref UploadsBucket

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject

functions:
  createDocument:
    handler: src.functions.create_document.handler
    events:
      - httpApi:
          path: /create
          method: POST

resources:
  Resources:
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: document-analyzer-uploads
