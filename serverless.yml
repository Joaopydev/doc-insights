org: jonvibes
service: document-analyzer-api

custom:
  pythonRequirements:
    dockerizePip: true

provider:
  name: aws
  region: us-east-1
  runtime: python3.11
  architecture: arm64
  environment:
    BUCKET_NAME: !Ref UploadsBucket
    DOCUMENT_TABLE: !Ref DocumentTable
    USER_TABLE: !Ref UserTable
    JWT_PRIVATE_KEY: ${env:JWT_PRIVATE_KEY}
    JWT_PUBLIC_KEY: ${env:JWT_PUBLIC_KEY}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub "${UploadsBucket.Arn}/*"

        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: !GetAtt DocumentTable.Arn

functions:
  createDocument:
    handler: src.functions.create_document.handler.handler
    events:
      - httpApi:
          path: /document
          method: POST

  signin:
    handler: src.functions.signin.handler.handler
    events:
      - httpApi:
          path: /signin
          method: POST

  signup:
    handler: src.functions.signup.handler.handler
    events:
      - httpApi:
          path: /signup
          method: POST

resources:
  Resources:
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: docinsight-raw-documents

    DocumentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: document-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: user-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
