org: jonvibes
service: document-analyzer-api

provider:
  name: aws
  region: us-east-1
  runtime: python3.11
  architecture: x86_64
  environment:
    BUCKET_NAME: !Ref UploadsBucket
    DOCUMENT_TABLE: !Ref DocumentTable
    CHAT_TABLE: !Ref ChatTable
    USER_TABLE: !Ref UserTable
    CONVERSATION_TABLE: !Ref ConversationTable
    CONNECTIONS_TABLE: !Ref ConnectionsTable
    TEXTRACT_TOPIC_ARN: !Ref TextractTopic
    TEXTRACT_ROLE_ARN: !GetAtt TextractPublishRole.Arn
    JWT_PRIVATE_KEY: ${env:JWT_PRIVATE_KEY}
    JWT_PUBLIC_KEY: ${env:JWT_PUBLIC_KEY}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL}
    REDIS_HOST: ${env:REDIS_HOST}
    REDIS_PORT: ${env:REDIS_PORT}
    QUESTIONS_QUEUE: !Ref QuestionsQueue
    WEBSOCKET_ENDPOINT:
      Fn::Sub: "https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub "${UploadsBucket.Arn}/*"

        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt DocumentTable.Arn
            - !Sub "${DocumentTable.Arn}/index/*"

            - !GetAtt UserTable.Arn
            - !Sub "${UserTable.Arn}/index/*"

            - !GetAtt ChatTable.Arn
            - !Sub "${ChatTable.Arn}/index/*"

            - !GetAtt ConversationTable.Arn
            - !Sub "${ConversationTable.Arn}/index/*"

            - !GetAtt ConnectionsTable.Arn
            - !Sub "${ConnectionsTable.Arn}/index/*"

        - Effect: Allow
          Action:
            - textract:StartDocumentAnalysis
            - textract:GetDocumentAnalysis
          Resource: "*"

        - Effect: Allow
          Action:
            - events:PutEvents
          Resource:
            - arn:aws:events:us-east-1:553004107808:event-bus/default

        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt QuestionsQueue.Arn

functions:
  createDocument:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.create_document.handler.handler
    events:
      - httpApi:
          path: /document
          method: POST

  signin:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.signin.handler.handler
    events:
      - httpApi:
          path: /signin
          method: POST

  signup:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.signup.handler.handler
    events:
      - httpApi:
          path: /signup
          method: POST

  startExtracting:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.start_extraction_text.handler.handler
    events:
      - eventBridge:
          pattern:
            source:
              - aws.s3
            detail-type:
              - Object Created
            detail:
              bucket:
                name:
                  - !Ref UploadsBucket
              object:
                key:
                  - wildcard: "*/raw/*"

  indexDocument:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.index_document.handler.handler
    events:
      - eventBridge:
          pattern:
            source:
              - aws.s3
            detail-type:
              - Object Created
            detail:
              bucket:
                name:
                  - !Ref UploadsBucket
              object:
                key:
                  - wildcard: "*/extracted/*"
    timeout: 15

  textractCompleted:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.textract_completed.handler.handler

  askQuestion:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.ask_question.handler.handler
    events:
      - httpApi:
          path: /chat
          method: POST

  questionProcessing:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.question_processing.handler.handler
    events:
      - eventBridge:
          pattern:
            source:
              - docinsight.chat
            detail-type:
              - QuestionAsked
    vpc:
      securityGroupIds:
        - ${env:LAMBDA_SECURITY_GROUP_ID}
      subnetIds:
        - ${env:SUBNET_ID}
        - ${env:SUBNET2_ID}
    timeout: 15

  updateCache:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.update_cache.handler.handler
    events:
      - eventBridge:
          pattern:
            source:
              - docinsight.chat
            detail-type:
              - UpdateCache
    vpc:
      securityGroupIds:
        - ${env:LAMBDA_SECURITY_GROUP_ID}
      subnetIds:
        - ${env:SUBNET_ID}
        - ${env:SUBNET2_ID}
    timeout: 15

  processQuestion:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.process_question.handler.handler
    events:
      - sqs:
          arn: !GetAtt QuestionsQueue.Arn
          batchSize: 1
    timeout: 30

  getMessages:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.get_message.handler.handler
    events:
      - httpApi:
          path: /messages/{conversation_id}
          method: GET

  websocketConnect:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.websocket_connect.handler.handler
    events:
      - websocket:
          route: $connect

  websocketDisconnect:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.websocket_disconnect.handler.handler
    events:
      - websocket:
          route: $disconnect

  websocketPostToConnection:
    image:
      uri: ${env:ECR_IMAGE_URI}
      command:
        - src.functions.websocket_post_to_connection.handler.handler
    events:
      - eventBridge:
          pattern:
            source:
              - docinsight.chat
            detail-type:
              - QuestionAnswered
    timeout: 15

resources:
  Resources:
    TextractTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: textract-document-completed

    TextractPublishRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: textract-publish-role
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: textract.amazonaws.com
              Action: sts:AssumeRole

        Policies:
          - PolicyName: PublishToSNS
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - sns:Publish
                  Resource: !Ref TextractTopic

    TextractSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref TextractTopic
        Protocol: lambda
        Endpoint: !GetAtt TextractCompletedLambdaFunction.Arn

    TextractPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref TextractCompletedLambdaFunction
        Action: lambda:InvokeFunction
        Principal: sns.amazonaws.com
        SourceArn: !Ref TextractTopic

    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: docinsight-raw-documents
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: true

    QuestionsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: question-queue-service
        VisibilityTimeout: 60
        RedrivePolicy:
          maxReceiveCount: 3
          deadLetterTargetArn: !GetAtt QuestionsDLQ.Arn

    QuestionsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: questions-queue-dlq-service

    DocumentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: document-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: s3_key
            AttributeType: S
          - AttributeName: textract_job_id
            AttributeType: S
          - AttributeName: extracted_text_key
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: storage-key-index
            KeySchema:
              - AttributeName: s3_key
                KeyType: HASH
            Projection:
              ProjectionType: ALL

          - IndexName: textract-job-id-index
            KeySchema:
              - AttributeName: textract_job_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

          - IndexName: extracted-text-key-index
            KeySchema:
              - AttributeName: extracted_text_key
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: user-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ChatTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: chat-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: conversation_id
            AttributeType: S
          - AttributeName: document_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: conversation-id-index
            KeySchema:
              - AttributeName: conversation_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

          - IndexName: document-id-index
            KeySchema:
              - AttributeName: document_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ConversationTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: conversation-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: document_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: document-id-index
            KeySchema:
              - AttributeName: document_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: connection-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connection_id
            AttributeType: S
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: connection_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user-id-index
            KeySchema:
              - AttributeName: user_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
