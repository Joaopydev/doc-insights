name: CI/CD Deployment Pipeline
on:
    push:
        branches:
            - master

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e LOCALSTACK_AUTH_TOKEN=$LOCALSTACK_AUTH_TOKEN \
            localstack/localstack:2026.10.0

      - name: Wait for LocalStack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack is ready"
              exit 0
            fi
            echo "Waiting for LocalStack... ($i/30)"
            sleep 2
          done
          echo "LocalStack did not become healthy"
          docker ps -a
          docker logs localstack
          exit 1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --prefer-binary --disable-pip-version-check
          pip install pytest
          pip install pytest-asyncio

      - name: Wait for LocalStack to be healthy
        run: |
          echo "Waiting for LocalStack on port 4566..."
          curl --silent --fail http://localhost:4566/_localstack/health || exit 1

      - name: Run tests
        env:
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
        run: pytest

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --prefer-binary --disable-pip-version-check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t 553004107808.dkr.ecr.us-east-1.amazonaws.com/document-analyzer-image:$IMAGE_TAG \
            -t 553004107808.dkr.ecr.us-east-1.amazonaws.com/document-analyzer-image:latest \
            --push .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy to AWS
        run: serverless deploy
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          ECR_IMAGE_URI: ${{ secrets.ECR_IMAGE_URI }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          SUBNET2_ID: ${{ secrets.SUBNET2_ID }}
          LAMBDA_SECURITY_GROUP_ID: ${{ secrets.LAMBDA_SECURITY_GROUP_ID }}
